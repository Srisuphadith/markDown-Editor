server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/markdown;

    # Relative redirects keep the host port (e.g. :8080) the browser used
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript text/markdown;

    # Locations below use `expires` rather than add_header so these stay inherited.
    # Everything the app needs is served from here; block anything else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    # Keep the old file name working
    location = /markdownReader.html {
        return 301 /;
    }

    # Vendored libraries are pinned versions, safe to cache
    location /lib/ {
        expires 30d;
    }

    location / {
        try_files $uri =404;
    }
}
